<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOREN | فورن</title>
<meta name="description" content="VOREN — A Moment to Savor. الرياض، العزيزية">
<meta name="theme-color" content="#F3E9DC">
<meta property="og:title" content="VOREN | فورن">
<meta property="og:description" content="A Moment to Savor — للحظة تستحق">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3E9DC;
    --bg2:#EFE3D3;
    --ink:#231E1A;
    --btn:#2A2420;
    --btn-hover:#3a322c;
    --cream:#F6EEE3;
    --line:#BFB2A2;
    --muted:#4A413A;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;overflow-x:hidden}
  html{background:var(--bg2)}
  body{
    font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
    background:radial-gradient(120% 80% at 50% 0%, var(--bg) 0%, var(--bg2) 100%);
    color:var(--ink);
    display:flex;justify-content:center;
    overflow-x:hidden;
  }
  .page{
    position:relative;width:100%;max-width:460px;
    padding:28px 22px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;
    overflow:hidden;
  }
  /* ظل أغصان الزيتون */
  .leaves{
    position:absolute;top:-30px;left:-30px;width:230px;height:260px;
    opacity:.22;filter:blur(3px);pointer-events:none;
  }

  /* الشعار */
  .logo{text-align:center;direction:ltr;position:relative;z-index:1}
  .logo .v{display:block;width:70px;height:74px;margin:0 auto 10px}
  .logo h1{
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:58px;letter-spacing:.14em;line-height:1;margin-right:-.14em;
  }
  .tagline{
    display:flex;align-items:center;gap:14px;margin-top:12px;
    font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:.18em;color:var(--muted);
  }
  .tagline::before,.tagline::after{content:"";width:62px;height:1px;background:var(--line)}

  /* صورة المحل */
  .hero{
    position:relative;width:100%;margin-top:26px;border-radius:26px;overflow:hidden;
    aspect-ratio:4/3;background:#d8c9b6;
    box-shadow:0 10px 30px -14px rgba(60,40,20,.35);
  }
  .hero img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transform:scale(1.04);transition:opacity 1.2s ease, transform 6s ease;
  }
  .hero img.on{opacity:1;transform:scale(1)}
  .dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:2}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);transition:all .3s}
  .dots i.on{width:20px;border-radius:4px;background:#fff}

  /* العنوان */
  .title{
    display:flex;align-items:center;gap:18px;width:100%;margin:26px 0 22px;
  }
  .title::before,.title::after{content:"";flex:1;height:1px;background:var(--line)}
  .title h2{font-family:'Amiri',serif;font-size:32px;font-weight:700;white-space:nowrap;line-height:1.3}

  /* الأزرار */
  .links{width:100%;display:flex;flex-direction:column;gap:13px;list-style:none}
  .links a{
    position:relative;display:flex;align-items:center;justify-content:center;
    height:66px;border-radius:16px;background:var(--btn);color:var(--cream);
    text-decoration:none;font-size:19px;font-weight:600;
    transition:transform .15s ease, background .2s ease;
  }
  .links a:hover{background:var(--btn-hover)}
  .links a:active{transform:scale(.98)}
  .links a .ico{
    position:absolute;left:24px;top:50%;transform:translateY(-50%);
    width:40px;height:40px;display:grid;place-items:center;
  }
  .links a .ico svg{width:34px;height:34px;stroke:var(--cream);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .links a .ico .brand-tag{
    font:700 7.5px/1 'IBM Plex Sans Arabic',sans-serif;fill:var(--cream);stroke:none;letter-spacing:-.02em
  }

  /* الموقع */
  .footer{
    display:flex;align-items:center;gap:12px;width:100%;margin-top:30px;
    font-size:17px;font-weight:500;color:var(--muted);
  }
  .footer::before,.footer::after{content:"";flex:1;height:1px;background:var(--line)}
  .footer svg{width:20px;height:20px;fill:var(--ink)}
  .footer span{display:flex;align-items:center;gap:8px;white-space:nowrap}

  @media (max-width:380px){
    .logo h1{font-size:48px}
    .tagline{font-size:16px}.tagline::before,.tagline::after{width:40px}
    .title h2{font-size:26px}
    .links a{height:60px;font-size:19px}
  }
</style>
</head>

<script>
/* ============================================

const LINKS = {
  menu:      "https://voren-1.github.io/voren-1/menubarcode.html",
  map:       "https://maps.app.goo.gl/SyHFCmVFWAhfd9717",
  keeta:     "https://url.mykeeta.com/dAjCYcIz",
  ninja:     "https://ninja.go.link/restaurants?restaurantId=28642",
  instagram: "https://www.instagram.com/voren.cafe",
  tiktok:    "https://www.tiktok.com/@voren.cafe"
};
/* ============================================ */

const ICONS = {
  menu: `<svg viewBox="0 0 36 36"><path d="M18 9c-3-2-8-2.5-12-1.5v20c4-1 9-.5 12 1.5 3-2 8-2.5 12-1.5v-20c-4-1-9-.5-12 1.5Z"/><path d="M18 9v20"/><path d="M9.5 13h5M9.5 17h5M9.5 21h5M21.5 13h5M21.5 17h5M21.5 21h5"/></svg>`,
  map:  `<svg viewBox="0 0 36 36"><path d="M18 32s-9-9.5-9-16a9 9 0 0 1 18 0c0 6.5-9 16-9 16Z"/><circle cx="18" cy="16" r="3.4"/></svg>`,
  keeta:`<svg viewBox="0 0 36 36"><path d="M7 12h22l-1.5 19h-19Z"/><path d="M13 12V9a5 5 0 0 1 10 0v3"/><text class="brand-tag" x="18" y="24.5" text-anchor="middle">keeta</text></svg>`,
  ninja:`<svg viewBox="0 0 36 36"><path d="M7 12h22l-1.5 19h-19Z"/><path d="M13 12V9a5 5 0 0 1 10 0v3"/><text class="brand-tag" x="18" y="24.5" text-anchor="middle">ninja</text></svg>`,
  instagram:`<svg viewBox="0 0 36 36"><rect x="5" y="5" width="26" height="26" rx="8"/><circle cx="18" cy="18" r="6"/><circle cx="25.5" cy="10.5" r="1" fill="currentColor"/></svg>`,
  tiktok:`<svg viewBox="0 0 36 36"><path d="M20 5v18.5a5.5 5.5 0 1 1-5.5-5.5" stroke-width="3"/><path d="M20 5c.5 4 3 6.5 7 7" stroke-width="3"/></svg>`
};

const ITEMS = [
  ["menu",      "تصفح المنيو"],
  ["map",       "موقعنا على الخريطة"],
  ["keeta",     "اطلب عبر كيتا"],
  ["ninja",     "اطلب عبر نينجا"],
  ["instagram", "تابعنا على إنستغرام"],
  ["tiktok",    "تابعنا على تيك توك"]
];

const ul = document.getElementById("links");
ITEMS.forEach(([key,label])=>{
  const url = LINKS[key];
  if(!url) return;                       // اترك الرابط فاضي "" لإخفاء الزر
  const external = /^https?:/.test(url);
  const li = document.createElement("li");
  li.innerHTML = `<a href="${url}" ${external?'target="_blank" rel="noopener"':''}>
      <span class="ico" style="color:#F6EEE3">${ICONS[key]}</span>${label}</a>`;
  ul.appendChild(li);
});

/* تبديل الصور تلقائيًا */
(()=>{
  const imgs=[...document.querySelectorAll('#hero img')];
  const dots=[...document.querySelectorAll('#hero .dots i')];
  let i=0;
  setInterval(()=>{
    imgs[i].classList.remove('on');dots[i].classList.remove('on');
    i=(i+1)%imgs.length;
    imgs[i].classList.add('on');dots[i].classList.add('on');
  },4000);
})();
